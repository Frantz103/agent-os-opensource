# Generated from src/agent_os/definitions.py; do not edit by hand.
spec_version: 1
name: agent_os_coordinator
description: NOOA-defined coordinator using Omnigent child sessions and policies
executor:
  type: omnigent
  config:
    harness: claude-sdk
prompt: |-
  You are the Agent OS coordinator. You manage one explicit task contract at a time.

  Begin by calling get_task_context with the task id in the request. Send the complete task
  context to planner with purpose `explore`. The planner returns a bounded plan; it never edits.

  Dispatch implementation through sys_session_send to exactly one of builder_claude or
  builder_codex unless the plan contains truly independent work items. Create an attempt record
  with start_attempt before dispatch. Give every builder the objective, workspace, constraints,
  acceptance criteria, and verification requirements. Builders work only inside the declared
  workspace. They do not push, merge, deploy, or mutate external systems.

  When a builder returns, call finish_attempt with its evidence. Then send its result and the
  actual workspace diff to a reviewer running on the other vendor: Claude work goes to
  reviewer_codex; Codex work goes to reviewer_claude. Call record_review with the verdict.
  A review is independent and read-only. If it requests changes, route one focused rework to the
  original builder and review again. Do not loop more than once; mark the task blocked if material
  issues remain.

  Child sessions notify you through the inbox. Dispatch independent work in the same turn, read
  the inbox once, and end the turn if results are still pending. Never busy-poll.

  Call complete_task only after acceptance criteria have evidence and the independent reviewer
  approves. Otherwise record blocked or failed truthfully. Your final answer must state the task
  id, outcome, changed files, exact verification commands/results, reviewer verdict, and remaining
  risks. Never substitute a green unit test for the requested end-to-end evidence.
async: true
cancellable: true
tools:
  agents:
  - planner
  - builder_claude
  - builder_codex
  - reviewer_claude
  - reviewer_codex
  get_task_context:
    type: function
    description: Load the authoritative task contract and prior evidence.
    callable: agent_os.tools.get_task_context
    parameters:
      type: object
      properties:
        task_id:
          type: string
      required:
      - task_id
  start_attempt:
    type: function
    description: Create an attributed attempt before child-agent dispatch.
    callable: agent_os.tools.start_attempt
    parameters:
      type: object
      properties:
        task_id:
          type: string
        agent:
          type: string
        harness:
          type: string
      required:
      - task_id
      - agent
      - harness
  finish_attempt:
    type: function
    description: Finalize a child attempt with status, summary, and evidence.
    callable: agent_os.tools.finish_attempt
    parameters:
      type: object
      properties:
        attempt_id:
          type: string
        status:
          type: string
          enum:
          - succeeded
          - failed
          - cancelled
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
      required:
      - attempt_id
      - status
      - summary
  record_review:
    type: function
    description: Persist an independent review verdict and its evidence.
    callable: agent_os.tools.record_review
    parameters:
      type: object
      properties:
        task_id:
          type: string
        attempt_id:
          type: string
        reviewer:
          type: string
        harness:
          type: string
        verdict:
          type: string
          enum:
          - approve
          - request_changes
          - blocked
        summary:
          type: string
        issues:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: string
      required:
      - task_id
      - reviewer
      - harness
      - verdict
      - summary
  complete_task:
    type: function
    description: Close a reviewed task with a truthful terminal outcome.
    callable: agent_os.tools.complete_task
    parameters:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
          enum:
          - completed
          - blocked
          - failed
        summary:
          type: string
      required:
      - task_id
      - status
      - summary
guardrails:
  ask_timeout: 86400
  policies:
    spawn_bounds:
      type: function
      function:
        path: omnigent.inner.nessie.policies.spawn_bounds
        arguments:
          max_dispatches_per_turn: 4
          dispatch_tools:
          - sys_session_send
    headless_subagent_purpose_guard:
      type: function
      function:
        path: omnigent.inner.nessie.policies.headless_subagent_purpose_guard
        arguments:
          allowed_purposes:
          - implement
          - review
          - explore
          - search
