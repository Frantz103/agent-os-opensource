[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-os-opensource"
version = "0.1.0"
description = "A thin, evidence-oriented multi-agent task layer over NVIDIA NOOA and Omnigent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Frantz Studio" }]
dependencies = [
  "nooa==0.0.8",
  "omnigent==0.8.2",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
agent-os = "agent_os.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
