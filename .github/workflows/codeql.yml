name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  ANALYSIS_SHA: ${{ github.sha }}
  EXACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ANALYSIS_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact CodeQL analysis identity
        shell: bash
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$ANALYSIS_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$(git rev-parse HEAD^1)" = "$BASE_HEAD_SHA"
            test "$(git rev-parse HEAD^2)" = "$EXACT_HEAD_SHA"
          else
            test "$ANALYSIS_SHA" = "$EXACT_HEAD_SHA"
          fi
          printf 'verified exact CodeQL analysis identity %s\n' "$actual_head"
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
      - id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          output: ${{ runner.temp }}/codeql-results
          # Code scanning uploads are unavailable on a private personal repository.
          # Keep analysis mandatory now and publish the same SARIF after the repo is public.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: false
      - name: Fail on CodeQL findings
        env:
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_dir = Path(os.environ["SARIF_OUTPUT"])
          files = sorted(sarif_dir.glob("*.sarif"))
          if not files:
              raise SystemExit(f"CodeQL produced no SARIF files in {sarif_dir}")

          findings = []
          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              for run in payload.get("runs", []):
                  findings.extend(run.get("results", []))

          if findings:
              for finding in findings:
                  rule = finding.get("ruleId", "unknown-rule")
                  message = finding.get("message", {}).get("text", "CodeQL finding")
                  level = finding.get("level", "warning")
                  print(f"{level}: CodeQL {rule}: {message}")
              raise SystemExit(f"CodeQL reported {len(findings)} finding(s)")

          print(f"CodeQL produced {len(files)} SARIF file(s) with no findings")
          PY
