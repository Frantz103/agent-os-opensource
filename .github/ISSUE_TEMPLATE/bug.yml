name: Bug report
description: Report a reproducible Agent OS defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private repository content. Report vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Agent OS version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, harness, and provider
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
